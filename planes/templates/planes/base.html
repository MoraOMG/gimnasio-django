<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titulo %}PowerFit Gym{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background:#f4f6f9; }
    .navbar { background:#111827; }
    .hero { background:linear-gradient(135deg,#111827,#dc2626); color:#fff; border-radius:1rem; }
    .card { border:0; box-shadow:0 2px 8px rgba(0,0,0,.08); }
    footer { color:#6b7280; }
  </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark">
  <div class="container">
    <a class="navbar-brand fw-bold" href="{% url 'planes:inicio' %}">🏋️ PowerFit Gym</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="menu">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="{% url 'planes:inicio' %}">Inicio</a></li>
        <li class="nav-item"><a class="nav-link" href="{% url 'planes:lista' %}">Planes</a></li>
        <li class="nav-item"><a class="nav-link" href="{% url 'planes:crear' %}">Nuevo plan</a></li>
      </ul>
    </div>
  </div>
</nav>

<main class="container my-4">
  {% if messages %}
    {% for m in messages %}
      <div class="alert alert-{% if m.tags == 'error' %}danger{% else %}{{ m.tags }}{% endif %} alert-dismissible fade show">
        {{ m }}
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
      </div>
    {% endfor %}
  {% endif %}
  {% block contenido %}{% endblock %}
</main>

<footer class="text-center py-4 small">PowerFit Gym · Evaluación Sumativa 02 · Programación Backend</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
