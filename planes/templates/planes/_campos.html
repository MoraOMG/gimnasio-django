{% if form.non_field_errors %}
  <div class="alert alert-danger">{{ form.non_field_errors }}</div>
{% endif %}
<div class="row">
  {% for campo in form %}
    <div class="{% if campo.name == 'descripcion' %}col-12{% else %}col-md-6{% endif %} mb-3">
      {% if campo.field.widget.input_type == 'checkbox' %}
        <div class="form-check form-switch">
          {{ campo }}
          <label class="form-check-label" for="{{ campo.id_for_label }}">{{ campo.label }}</label>
        </div>
      {% else %}
        <label class="form-label fw-semibold" for="{{ campo.id_for_label }}">{{ campo.label }}</label>
        {{ campo }}
      {% endif %}
      {% for error in campo.errors %}
        <div class="text-danger small mt-1">⚠ {{ error }}</div>
      {% endfor %}
    </div>
  {% endfor %}
</div>
